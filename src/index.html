<!doctype html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>A-Frame: Image Targets Example</title>
  <!-- No favicon, avoids a 404 error in the console. -->
  <link rel="icon" href="data:,">

  <script crossorigin="anonymous" src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/gh/vincentfretin/8thwall@b8541e7baa85bdf8d8e3f8c6c45022bb249f9e74/prebuilt/engine/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <!-- XRExtras and the XR8 engine are built from the feat/aframe-1-8-0 branch of
       vincentfretin/8thwall (prebuilt on the feat/aframe-1-8-0-build branch) until they are
       released. Then: https://cdn.jsdelivr.net/npm/@8thwall/xrextras@2/dist/xrextras.js -->
  <script src="https://cdn.jsdelivr.net/gh/vincentfretin/8thwall@b8541e7baa85bdf8d8e3f8c6c45022bb249f9e74/prebuilt/xrextras/xrextras.js" crossorigin="anonymous"></script>
</head>
<body>
  <script src="bundle.js"></script>
  <a-scene xrextras-gesture-detector landing-page xrextras-loading xrextras-runtime-error
    xrweb="disableWorldTracking: true">

    <a-assets>
      <!-- Credit to Poly by Google for the model: https://poly.google.com/view/dA5osnS0Rzj -->
      <a-asset-item id="jelly-glb" src="assets/jellyfish-model.glb"></a-asset-item>
      <img id="jelly-thumb" src="assets/video-target.jpg">
      <video id="jelly-video" autoplay muted crossorigin="anonymous" loop="true" src="assets/jellyfish-video.mp4">
      </video>
    </a-assets>

    <a-camera position="0 4 10" raycaster="objects: .cantap" cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="1.57" position="1 1 1"></a-light>

    <a-light type="ambient" intensity="3.14"></a-light>

    <!-- Note: "name:" must be set to the name of the image target -->
    <xrextras-named-image-target name="video-target">
      <a-entity xrextras-play-video="video: #jelly-video; thumb: #jelly-thumb; canstop: true"
        geometry="primitive: plane; height: 1; width: 0.79;"></a-entity>
    </xrextras-named-image-target>

    <!-- Note: "name:" must be set to the name of the image target  -->
    <xrextras-named-image-target name="model-target">
      <!-- Add a child entity that can be rotated independently of the image target. -->
      <a-entity xrextras-one-finger-rotate gltf-model="#jelly-glb"></a-entity>
    </xrextras-named-image-target>

  </a-scene>

</body>

</html>
